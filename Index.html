<style>
/* base reset */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

<title>ADJ Maintenance Services</title>
<meta name="description" content="ADJ Maintenance Services — office and commercial cleaning plus appliance installation: microwaves, refrigerators, dishwashers, ranges, washers and dryers. Call (561) 727-7860.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sticky phone bar → centered logo masthead → hero with emblem "reactor" → service ticker → octagon service grid → why → steps → call-prep checklist → red call band. Light-only by client request. */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --mist:#f4f6f9;
  --line:#e3e7ee;
  --ink:#14161c;
  --ink-soft:#4b5260;
  --red:#e3121b;
  --red-deep:#b30a12;
  --red-tint:#fff1f1;
  --ok:#17944a;
  --chrome:linear-gradient(180deg,#ffffff 0%,#eceff4 55%,#d7dce5 100%);
  --f-display:"Exo 2","Segoe UI",system-ui,sans-serif;
  --f-label:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --oct:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.label{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.18em;font-size:.78rem;color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#2fd36b;flex:none;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(47,211,107,.6)}70%,100%{box-shadow:0 0 0 8px rgba(47,211,107,0)}}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:#fff}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;flex-wrap:wrap}
.topbar .hours{font-family:var(--f-label);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#c9ced8;display:flex;align-items:center;gap:8px}
.top-actions{display:flex;gap:8px;align-items:center}
.top-phone,.top-text{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--f-label);font-weight:700;letter-spacing:.06em;padding:6px 14px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:background .2s}
.top-phone{background:var(--red);color:#fff;font-size:1.02rem}
.top-phone:hover{background:var(--red-deep)}
.top-text{background:#2a2e38;color:#fff;font-size:.82rem;text-transform:uppercase;letter-spacing:.14em}
.top-text:hover{background:#3a3f4b}
.top-phone svg,.top-text svg{width:16px;height:16px}

/* ---------- Masthead ---------- */
.masthead{text-align:center;padding-block:26px 0;background:radial-gradient(55% 80% at 50% 38%,rgba(227,18,27,.08),transparent 70%),var(--bg)}
.masthead img{display:block;width:min(430px,84%);height:auto;margin:0 auto;filter:drop-shadow(0 14px 22px rgba(179,10,18,.18))}
nav.main{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 30px;padding-block:14px 0}
nav.main a{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:.82rem;text-decoration:none;color:var(--ink-soft);padding:6px 2px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav.main a:hover{color:var(--red);border-color:var(--red)}
.rule{height:2px;margin-top:16px;background:linear-gradient(90deg,transparent,var(--red) 30%,var(--red) 70%,transparent)}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/44px 44px,var(--mist)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 75% 50%,rgba(255,255,255,.4),rgba(255,255,255,.93) 70%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding-block:60px 68px}
.hero h1{font-size:clamp(2.3rem,5.2vw,4rem);font-weight:800;letter-spacing:-.01em;margin-top:14px}
.hero h1 em{font-style:italic;color:var(--red)}
.hero .lede{margin-top:18px;font-size:1.13rem;color:var(--ink-soft);max-width:34em}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border:0;cursor:pointer;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.92rem;padding:15px 26px;clip-path:var(--cut);transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:18px;height:18px}
.btn-red{background:var(--red);color:#fff;box-shadow:0 10px 24px rgba(227,18,27,.3)}
.btn-red:hover{background:var(--red-deep)}
.btn-ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn-ghost:hover{background:var(--ink);color:#fff}
.hero-num{margin-top:18px;font-family:var(--f-label);font-weight:600;letter-spacing:.06em;color:var(--ink-soft)}
.hero-num a{color:var(--ink);font-weight:700;font-size:1.25rem;text-decoration:none;border-bottom:2px solid var(--red)}
.trust{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:26px;font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.82rem}
.trust span{display:inline-flex;align-items:center;gap:8px}
.trust svg{width:18px;height:18px;color:var(--red)}

/* emblem reactor */
.reactor{position:relative;aspect-ratio:1/1;max-width:100%;width:min(480px,100%);justify-self:center;display:grid;place-items:center}
.ring{position:absolute;clip-path:var(--oct);display:block}
.ring.r1{inset:0;background:conic-gradient(from 0deg,var(--red),transparent 18%,transparent 50%,var(--red) 62%,transparent 80%);animation:spin 14s linear infinite;opacity:.9}
.ring.r1::after,.ring.r2::after{content:"";position:absolute;inset:3px;clip-path:var(--oct);background:var(--bg)}
.ring.r2{inset:9%;background:var(--line);animation:spin 22s linear infinite reverse}
.ring.r3{inset:17%;background:var(--chrome);box-shadow:inset 0 0 0 2px var(--line)}
.ring.r3::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0,rgba(227,18,27,.14) 48%,rgba(227,18,27,.28) 50%,rgba(227,18,27,.14) 52%,transparent 100%);background-size:100% 200%;animation:scan 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%{background-position:0 100%}100%{background-position:0 -100%}}
.reactor img{position:relative;z-index:2;width:72%;height:auto;filter:drop-shadow(0 18px 26px rgba(179,10,18,.28));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.chip{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px -10px rgba(20,22,28,.25);padding:8px 12px;font-family:var(--f-label);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.chip svg{width:16px;height:16px;color:var(--red)}
.chip.c1{top:8%;left:-2%}
.chip.c2{top:44%;right:-4%}
.chip.c3{bottom:8%;left:6%}
.chip.live{color:var(--ok)}

/* ticker */
.ticker{background:var(--ink);color:#fff;overflow:hidden;border-block:3px solid var(--red)}
.ticker-track{display:flex;width:max-content;animation:tick 34s linear infinite}
.ticker span{display:inline-flex;align-items:center;gap:18px;padding:14px 18px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:.86rem;white-space:nowrap}
.ticker span::after{content:"";width:9px;height:9px;background:var(--red);clip-path:var(--oct)}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- Sections ---------- */
section.block{padding-block:84px}
.sec-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-bottom:46px}
.sec-head h2{font-size:clamp(1.9rem,3.6vw,2.8rem);font-weight:800}
.sec-head p{color:var(--ink-soft);max-width:36em}

.services{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.svc{position:relative;background:#fff;border:1px solid var(--line);padding:28px 22px 22px;display:flex;flex-direction:column;gap:12px;transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}
.svc::before{content:"";position:absolute;left:0;top:0;height:3px;width:0;background:var(--red);transition:width .35s}
.svc:hover{transform:translateY(-4px);border-color:rgba(227,18,27,.5);box-shadow:0 18px 36px -18px rgba(227,18,27,.45)}
.svc:hover::before{width:100%}
.oct{width:62px;height:62px;clip-path:var(--oct);background:var(--red);display:grid;place-items:center;position:relative;transition:transform .4s}
.svc:hover .oct{transform:rotate(45deg)}
